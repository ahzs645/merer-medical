name: Playwright Integration Tests
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/web-e2e/**"
      - "data/**"
      - "libs/**"
      - "packages/**"
      - ".gitmodules"
      - ".node-version"
      - "nx.json"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.base.ts"
      - "tsconfig.base.json"
      - ".github/workflows/playwright-integration-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up npm
        run: npm install -g npm@11.7.0
      - name: Install dependencies
        run: npm ci
      - name: Verify required submodules
        run: test -f packages/immunization-forecast/src/index.ts
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Install mkcert
        run: sudo apt install mkcert
      - name: Generate certs
        run: mkdir -p .dev/certs/ && mkcert -key-file .dev/certs/localhost-key.pem -cert-file .dev/certs/localhost.pem localhost
      - name: Install local certs
        run: mkcert -install
      - name: Setup api env vars
        run: cp .example.env .env
      - name: Run Playwright tests
        # The Nx serve target starts the API and web app in parallel. Keep a
        # command-level ceiling below the job timeout so a failed child server
        # cannot leave its sibling holding the runner indefinitely.
        run: timeout 1200 npx nx run web-e2e:e2e

  mobile:
    name: Mobile production workflows
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      NX_DAEMON: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up npm
        run: npm install -g npm@11.7.0
      - name: Install dependencies
        run: npm ci
      - name: Verify required submodules
        run: test -f packages/immunization-forecast/src/index.ts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production web app
        run: npm exec nx -- build web --configuration=production
      - name: Run mobile workflows with synthetic records
        # The dedicated config starts the static production preview itself.
        # /demo uses an in-memory database; no API server, portal credentials,
        # or patient package is needed for these browser journeys.
        run: npx playwright test --config apps/web-e2e/playwright.mobile.config.ts
      - name: Upload mobile screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/mobile/
          if-no-files-found: warn
          retention-days: 7
