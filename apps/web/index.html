<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mere</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Safari reads none of these from the manifest: without them an iPhone
         home-screen icon is a screenshot of whatever page was open, and the
         status bar is not Mere's colour. -->
    <link rel="apple-touch-icon" href="/assets/icon/apple-touch-icon.png" />
    <meta name="theme-color" content="#006183" />
    <meta name="apple-mobile-web-app-title" content="Mere" />
    <!-- Light-only for now. Saying so stops browsers that force a dark theme
         on pages from inverting charts and record colours. -->
    <meta name="color-scheme" content="light" />
    <meta property="og:title" content="Mere Medical" />
    <meta
      property="og:description"
      content="Manage all of your medical records in one place. Mere syncs your records across hospital systems for you. Self-hosted and offline-first"
    />
    <meta
      property="description"
      content="Manage all of your medical records in one place. Mere syncs your records across hospital systems for you. Self-hosted and offline-first"
    />
  </head>
  <body>
    <div id="root" class="bg-white"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
